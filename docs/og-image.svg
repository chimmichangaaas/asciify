<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#1a1226"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#a8a4ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <g fill="#4f46e5" opacity="0.16">
    <!-- Row 1 -->
    <circle cx="40"   cy="50"  r="1.5"/><circle cx="80"   cy="50"  r="1.5"/><circle cx="120"  cy="50"  r="1.5"/>
    <circle cx="160"  cy="50"  r="1.5"/><circle cx="200"  cy="50"  r="1.5"/><circle cx="240"  cy="50"  r="1.5"/>
    <circle cx="280"  cy="50"  r="1.5"/><circle cx="320"  cy="50"  r="1.5"/><circle cx="360"  cy="50"  r="1.5"/>
    <circle cx="400"  cy="50"  r="1.5"/><circle cx="440"  cy="50"  r="1.5"/><circle cx="480"  cy="50"  r="1.5"/>
    <circle cx="520"  cy="50"  r="1.5"/><circle cx="560"  cy="50"  r="1.5"/><circle cx="600"  cy="50"  r="1.5"/>
    <circle cx="640"  cy="50"  r="1.5"/><circle cx="680"  cy="50"  r="1.5"/><circle cx="720"  cy="50"  r="1.5"/>
    <circle cx="760"  cy="50"  r="1.5"/><circle cx="800"  cy="50"  r="1.5"/><circle cx="840"  cy="50"  r="1.5"/>
    <circle cx="880"  cy="50"  r="1.5"/><circle cx="920"  cy="50"  r="1.5"/><circle cx="960"  cy="50"  r="1.5"/>
    <circle cx="1000" cy="50"  r="1.5"/><circle cx="1040" cy="50"  r="1.5"/><circle cx="1080" cy="50"  r="1.5"/>
    <circle cx="1120" cy="50"  r="1.5"/><circle cx="1160" cy="50"  r="1.5"/>
  </g>

  <!-- Decorative ASCII glyphs (top-right) -->
  <text x="900" y="90" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="22" fill="#7c3aed" opacity="0.4" letter-spacing="6">
    ⠿ ⡿ ⣿ ⢿ ⡏ ⠟
  </text>

  <!-- Big halftone block bottom-left for visual texture -->
  <g transform="translate(60, 470)" fill="#4f46e5" opacity="0.18" font-family="'SF Mono',monospace" font-size="14">
    <text x="0"   y="0">⬤●●○○∘∘··  ⬤●○∘·   ●○∘·  ⬤●○∘</text>
    <text x="0"  y="16">●●○○∘∘··    ●○∘·     ●○∘·  ●○∘·</text>
    <text x="0"  y="32">○○∘∘··      ○∘·       ○∘·   ○∘·</text>
  </g>

  <!-- Logo mark with shadow -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#logoGrad)"
          filter="url(#glow)"
          style="filter: drop-shadow(0 10px 30px rgba(79,70,229,0.5));"/>
    <text x="60" y="92" font-family="'SF Mono','Menlo',monospace" font-size="74"
          fill="#fff" text-anchor="middle" font-weight="700">⠿</text>
  </g>

  <!-- Title -->
  <text x="240" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
        font-size="96" font-weight="800" fill="url(#titleGrad)" letter-spacing="-3">
    ASCII Studio
  </text>

  <!-- Tagline -->
  <text x="244" y="320" font-family="-apple-system, 'Inter', sans-serif"
        font-size="28" font-weight="400" fill="#a8a4cf">
    Turn images into typographic art.
  </text>

  <!-- Feature pills -->
  <g font-family="-apple-system, 'Inter', sans-serif" font-size="14" font-weight="600">
    <g transform="translate(244, 380)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="rgba(79,70,229,0.18)" stroke="rgba(79,70,229,0.4)"/>
      <text x="60" y="21" fill="#a8a4ff" text-anchor="middle">⚡ Mask reveals</text>
    </g>
    <g transform="translate(376, 380)">
      <rect x="0" y="0" width="140" height="32" rx="16" fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.4)"/>
      <text x="70" y="21" fill="#c084fc" text-anchor="middle">🎨 6 render modes</text>
    </g>
    <g transform="translate(528, 380)">
      <rect x="0" y="0" width="140" height="32" rx="16" fill="rgba(234,88,12,0.18)" stroke="rgba(234,88,12,0.4)"/>
      <text x="70" y="21" fill="#fb923c" text-anchor="middle">📦 17+ exports</text>
    </g>
  </g>

  <!-- Bottom strip — author -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="80" y="565" font-family="-apple-system, 'Inter', sans-serif" font-size="22" font-weight="500" fill="#9090b0">
    Built by <tspan fill="#c084fc" font-weight="700">Yash Saindane</tspan>
  </text>
  <text x="80" y="594" font-family="'SF Mono','Menlo',monospace" font-size="15" fill="#5a5a78">
    @yashsaindane  ·  github.com/yashsaindane
  </text>

  <!-- Decorative ASCII bottom-right -->
  <text x="1140" y="580" font-family="'SF Mono','Menlo',monospace" font-size="42" font-weight="700"
        fill="url(#logoGrad)" text-anchor="end" opacity="0.85">
    ⠿⡿⣿
  </text>

  <!-- Vignette overlay -->
  <rect width="1200" height="630" fill="url(#vignette)" pointer-events="none"/>
</svg>
